<svg xmlns="http://www.w3.org/2000/svg" width="360" height="514" viewBox="0 0 360 514" role="img" aria-labelledby="title"><title id="title">정상 응답과 첫 줄 수신 후 취소의 결과 비교</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="360" height="514" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, sans-serif" fill="#0f172a"><text x="180" y="34" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="700">끝까지 받기 vs. 중간에 끊기</text><text x="180" y="58" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">첫 번째 조각을 받은 뒤 결과가 갈립니다</text><text x="94" y="95" text-anchor="middle" font-size="17" fill="#166534" font-weight="700">정상 완료</text><text x="266" y="95" text-anchor="middle" font-size="17" fill="#9a3412" font-weight="700">수신 중 취소</text><rect x="18" y="110" width="152" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="94.0" y="139" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">first 수신</text><text x="94.0" y="163" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">클라이언트 data</text><path d="M94 184 V208" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="190" y="110" width="152" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="266.0" y="139" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">first 수신</text><text x="266.0" y="163" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">클라이언트 data</text><path d="M266 184 V208" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="214" width="152" height="72" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="94.0" y="243" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">second 수신</text><text x="94.0" y="267" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">본문 전체 도착</text><path d="M94 288 V312" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="190" y="214" width="152" height="72" rx="12" fill="#ffedd5" stroke="#fdba74"/><text x="266.0" y="243" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">연결 끊기</text><text x="266.0" y="267" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">response.destroy()</text><path d="M266 288 V312" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="318" width="152" height="78" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="94.0" y="347" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">본문 읽기 완료</text><text x="94.0" y="371" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">클라이언트 end</text><rect x="190" y="318" width="152" height="78" rx="12" fill="#ffedd5" stroke="#fdba74"/><text x="266.0" y="347" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">완료 전 close</text><text x="266.0" y="371" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">클라이언트 end 없음</text><text x="94" y="424" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">본문 전체 수신</text><text x="266" y="442" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="600">complete = false</text><text x="180" y="463" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">서버 finish는 별도의 완료 신호입니다</text><text x="180" y="488" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">수신과 finish의 상대 순서는 고정하지 않습니다</text><text x="266" y="418" text-anchor="middle" font-size="13" fill="#9a3412">클라이언트의</text></g></svg>