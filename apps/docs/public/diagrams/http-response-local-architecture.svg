<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title"><title id="title">하나의 Node.js 프로세스와 운영체제 loopback 통신</title><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#15803d" stroke-width="1.5"/></marker></defs><rect width="360" height="620" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#0f172a"><text x="180" y="34" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="700">이번 코드의 로컬 구조</text><text x="180" y="59" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">한 컴퓨터 · 외부 인터넷 없음</text><rect x="16" y="82" width="328" height="230" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="180" y="109" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="600">하나의 Node.js 프로세스</text><rect x="30" y="128" width="136" height="158" rx="12" fill="#eff6ff" stroke="#93c5fd"/><rect x="194" y="128" width="136" height="158" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="98" y="158" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">HTTP 클라이언트</text><text x="98" y="189" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">get() → 요청</text><text x="98" y="217" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">응답: IncomingMessage</text><text x="98" y="245" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">data · end · close</text><text x="262" y="158" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">HTTP 서버</text><text x="262" y="189" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">createServer()</text><text x="262" y="217" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">req: 요청 읽기</text><text x="262" y="245" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">res: 응답 쓰기</text><rect x="28" y="410" width="304" height="142" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="180" y="439" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">운영체제: 소켓 · TCP 루프백</text><path d="M76 286 V476 H240 V286" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/><path d="M284 286 V520 H120 V286" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#green)"/><text x="54" y="352" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">요청</text><text x="305" y="378" text-anchor="middle" font-size="14" fill="#15803d" font-weight="600">응답</text><text x="180" y="581" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">같은 프로세스여도 소켓 통신을 거칩니다</text><text x="180" y="604" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">127.0.0.1은 현재 컴퓨터로 돌아오는 주소입니다</text></g></svg>