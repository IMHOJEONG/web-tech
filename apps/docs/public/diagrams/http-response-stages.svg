<svg xmlns="http://www.w3.org/2000/svg" width="360" height="548" viewBox="0 0 360 548" role="img" aria-labelledby="title"><title id="title">서버 쓰기와 클라이언트 수신, 화면 표시의 경계</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="360" height="548" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, sans-serif" fill="#0f172a"><text x="180" y="34" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="700">응답이 지나가는 네 단계</text><text x="180" y="58" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">각 단계에서 확인할 수 있는 범위가 다릅니다</text><rect x="34" y="80" width="292" height="72" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="180.0" y="109" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">1. 서버에서 쓰기</text><text x="180.0" y="133" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">res.write() · res.end()</text><path d="M180 154 V178" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="34" y="184" width="292" height="72" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="180.0" y="213" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">2. 소켓과 네트워크</text><text x="180.0" y="237" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">버퍼를 거쳐 클라이언트로 전달합니다</text><path d="M180 258 V282" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="34" y="288" width="292" height="72" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="180.0" y="317" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">3. 클라이언트에서 읽기</text><text x="180.0" y="341" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">data: 일부 수신 / end: 읽기 완료</text><path d="M180 362 V386" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="34" y="392" width="292" height="72" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="180.0" y="421" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="600">4. 브라우저에 표시</text><text x="180.0" y="445" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">파싱과 렌더링이 필요합니다</text><text x="180" y="495" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="600">finish: 전체 응답을 운영체제에 전달</text><text x="180" y="520" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">수신 확인·화면 표시 완료 신호는 아닙니다</text></g></svg>