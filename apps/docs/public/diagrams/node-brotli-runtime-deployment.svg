<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1220" viewBox="0 0 800 1220" role="img" aria-labelledby="title desc"><title id="title">Brotli 런타임 패치를 개발에서 운영 프로세스까지 전달하는 경로</title><desc id="desc">개발 PC와 CI 런타임은 운영 런타임과 별개입니다. 직접 관리하는 이미지·서버 경로와 공급자가 관리하는 런타임 경로는 서로 다른 운영 대상에 적용됩니다. 수정된 런타임을 배포하고 실행 프로세스를 교체한 뒤 배포 식별자와 실제 프로세스의 버전을 대조해야 합니다. 실제 운영 배포를 관측한 그림은 아닙니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;text-anchor:middle;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:30px;font-weight:700}.small{font-size:27px}.note{font-size:25px;fill:#475569}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#a)}.conditional{stroke-dasharray:8 7}.green{stroke:#15803d;marker-end:url(#green)}</style><rect width="800" height="1220" rx="24" fill="#f8fafc"/><text x="400" y="54" class="title">수정된 런타임이 운영에 도달하는 경로</text><text x="400" y="98" class="note">개발·빌드·운영은 서로 다른 실행 환경입니다</text><rect x="40" y="136" width="340" height="152" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="210" y="179" class="label">개발 PC</text><text x="210" y="222" class="small">로컬 Node.js 교체</text><text x="210" y="263" class="note">운영 교체의 증거는 아님</text><rect x="420" y="136" width="340" height="152" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="590" y="179" class="label">CI 빌드·테스트</text><text x="590" y="222" class="small">CI가 선택한 Node.js 확인</text><text x="590" y="263" class="note">빌드 성공 ≠ 운영 패치</text><text x="400" y="336" class="small">운영 런타임 제공 방식에 따라 경로가 갈립니다</text><rect x="24" y="376" width="752" height="320" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="400" y="420" class="note">운영 대상에 맞는 경로를 적용합니다</text><rect x="44" y="446" width="344" height="218" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="216" y="489" class="label">직접 관리하는 환경</text><text x="216" y="534" class="small">Docker 이미지·서버</text><text x="216" y="576" class="small">수정된 Node.js 포함</text><text x="216" y="621" class="note">이미지 빌드·실행 파일 교체</text><rect x="412" y="446" width="344" height="218" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="489" class="label">관리형 플랫폼</text><text x="584" y="534" class="small">공급자의 런타임 정책</text><text x="584" y="576" class="small">패치 제공 상태 확인</text><text x="584" y="621" class="note">공급자 안내에 따라 재배포</text><path d="M216 664 V728 H400 V762" class="arrow "/><path d="M584 664 V728 H400" class="arrow "/><rect x="76" y="778" width="648" height="148" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="400" y="823" class="label">새 운영 프로세스로 교체</text><text x="400" y="866" class="small">재배포·재시작 → 새 프로세스 기동</text><text x="400" y="905" class="note">기존 프로세스 종료 여부·배포 ID 대조</text><path d="M400 926 V970" class="arrow "/><rect x="76" y="982" width="648" height="110" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="400" y="1025" class="label">요청을 처리하는 프로세스 확인</text><text x="400" y="1065" class="note">새 셸의 node 버전만으로 완료 판정하지 않음</text><text x="400" y="1143" class="note">npm update · lockfile 변경은 Node 실행 파일 교체와 다릅니다</text><text x="400" y="1181" class="note">운영 절차의 개념도 · 실제 배포·패치 적용은 미검증</text></svg>
