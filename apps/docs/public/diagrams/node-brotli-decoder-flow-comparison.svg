<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1206" viewBox="0 0 800 1206" role="img" aria-labelledby="title desc"><title id="title">정상 입력 부족과 Brotli 형식 오류의 수정 전후 처리 비교</title><desc id="desc">정상적인 입력 부족은 다음 입력으로 읽기를 재시도하며, 조건이 맞으면 다음 상태로 진행합니다. 취약한 safe 경로는 형식 오류의 false를 입력 부족으로 잘못 바꾸어 상태 진전 없는 보충을 반복할 수 있습니다. 수정 후에는 블록 전환 형식 오류를 상위로 전달하고 해당 디코더 처리를 중단합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;text-anchor:middle;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:30px;font-weight:700}.small{font-size:28px}.note{font-size:25px;fill:#475569}.code{font-family:Arial,sans-serif;font-size:25px;font-weight:700}</style><rect width="800" height="1206" rx="24" fill="#f8fafc"/><text x="400" y="54" class="title">입력 부족과 형식 오류를 구분해야 합니다</text><text x="400" y="98" class="note">정상 입력 · 수정 전 오류 · 수정 후 오류의 비교</text><rect x="24" y="132" width="752" height="222" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="400" y="175" class="label">1 · 정상적인 입력 부족</text><rect x="50" y="206" width="318" height="80" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="209" y="255" class="small">아직 덜 도착한 데이터</text><path d="M368 246 H420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="206" width="330" height="80" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="585" y="255" class="code">NEEDS_MORE_INPUT</text><text x="400" y="328" class="note">추가 바이트 → 읽기 재시도 · 조건이 맞으면 진행</text><rect x="24" y="392" width="752" height="346" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text x="400" y="435" class="label">2 · 수정 전의 잘못된 블록 전환</text><rect x="50" y="468" width="318" height="86" rx="16" fill="#fff" stroke="#fb7185" stroke-width="2"/><text x="209" y="501" class="note">더 받아도 해결되지 않는</text><text x="209" y="539" class="label">형식 오류</text><path d="M368 510 H420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="468" width="330" height="86" rx="16" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="585" y="520" class="code">BROTLI_FALSE</text><path d="M585 554 V578 H400 V600" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="600" width="620" height="76" rx="16" fill="#fff" stroke="#fb7185" stroke-width="2"/><text x="400" y="648" class="small">NEEDS_MORE_INPUT으로 오분류</text><text x="400" y="714" class="note">조건이 이어지면 보충 반복 → 배열 범위 밖 쓰기 위험</text><rect x="24" y="778" width="752" height="296" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="400" y="821" class="label">3 · 수정 후의 잘못된 블록 전환</text><rect x="50" y="856" width="318" height="86" rx="16" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="209" y="889" class="note">더 받아도 해결되지 않는</text><text x="209" y="927" class="label">형식 오류</text><path d="M368 898 H420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="856" width="330" height="86" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="585" y="908" class="code">FORMAT_BLOCK_SWITCH</text><text x="400" y="992" class="small">형식 오류를 상위 호출자로 그대로 전달</text><text x="400" y="1040" class="note">디코더 오류로 중단 · 해당 입력 보충 반복을 막음</text><text x="400" y="1125" class="note">상태 변화의 개념도 · 전체 디코더를 그린 것은 아닙니다</text><text x="400" y="1166" class="note">실제 악성 입력·메모리 손상·공격 성공은 미재현</text></svg>
