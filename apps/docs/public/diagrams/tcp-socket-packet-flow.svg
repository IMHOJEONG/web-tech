<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
<title id="title">한 연결의 실제 패킷 흐름</title><desc id="desc">10월 11일 별도 실행. 클라이언트 60187과 서버 60116 사이 SYN, SYN ACK, ACK, 추가 ACK, 요청 60바이트와 ACK, 응답 136바이트와 ACK, 서버 FIN과 ACK, 클라이언트 FIN과 ACK 순서. 화살표 간격은 시간 비율이 아닙니다.</desc>
