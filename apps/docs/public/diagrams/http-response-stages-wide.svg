<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="응답이 지나가는 네 단계"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="800" height="270" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">응답이 지나가는 네 단계</text><text x="400" y="57" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">데이터가 이동하는 경로와 완료 신호의 의미는 다릅니다</text><rect x="20" y="85" width="166" height="100" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="103.0" y="113" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">1. 서버에서 쓰기</text><text x="103.0" y="137" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">res.write()</text><text x="103.0" y="161" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">res.end()</text><rect x="218" y="85" width="166" height="100" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="301.0" y="113" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">2. 전송 경로</text><text x="301.0" y="137" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">소켓 · 네트워크</text><text x="301.0" y="161" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">버퍼를 거쳐 전달</text><rect x="416" y="85" width="166" height="100" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="499.0" y="113" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">3. 클라이언트 읽기</text><text x="499.0" y="137" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">data: 일부 수신</text><text x="499.0" y="161" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">end: 읽기 완료</text><rect x="614" y="85" width="166" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="697.0" y="113" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">4. 브라우저 표시</text><text x="697.0" y="137" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">파싱 · 렌더링</text><text x="697.0" y="161" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">이번 실험 범위 밖</text><path d="M189 135 L213 135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M387 135 L411 135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 135 L609 135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1d4ed8">finish: 전체 응답을 운영체제에 전달한 서버 신호</text><text x="400" y="246" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">클라이언트 수신·화면 표시가 완료되었다는 뜻은 아닙니다</text></g></svg>