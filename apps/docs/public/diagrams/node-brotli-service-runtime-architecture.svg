<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1250" viewBox="0 0 800 1250" role="img" aria-labelledby="title desc"><title id="title">Brotli 입력 경로와 실행 프로세스 아키텍처</title><desc id="desc">A는 Vercel WAF를 경유하는 요청 예시이고 B는 앱이 요청해서 가져온 외부 응답입니다. 외부 응답은 해당 요청 WAF를 거치지 않습니다. 앱 또는 라이브러리가 Brotli 해제를 수행하는 경우에만 Node.js 프로세스 내부의 API와 네이티브 디코더에 도달할 수 있습니다. 이는 실제 HeapForge 배치나 공급자 임시 보호의 적용 상태를 나타내지 않습니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;text-anchor:middle;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:30px;font-weight:700}.small{font-size:27px}.note{font-size:25px;fill:#475569}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#a)}.conditional{stroke-dasharray:8 7}.green{stroke:#15803d;marker-end:url(#green)}</style><rect width="800" height="1250" rx="24" fill="#f8fafc"/><text x="400" y="54" class="title">요청과 외부 응답은 다른 길로 들어옵니다</text><text x="400" y="96" class="note">서비스 구성 + Node.js 프로세스 내부</text><rect x="40" y="128" width="340" height="104" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="210" y="172" class="label">외부 사용자</text><text x="210" y="211" class="small">A · Brotli 요청 본문</text><rect x="420" y="128" width="340" height="104" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="590" y="172" class="label">외부 API·파일 서버</text><text x="590" y="211" class="small">B · Brotli 응답 제공</text><path d="M210 232 V282" class="arrow "/><rect x="40" y="282" width="340" height="124" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="210" y="324" class="label">Vercel Network / WAF</text><text x="210" y="361" class="note">알려진 패턴 대상 차단 규칙</text><text x="210" y="392" class="note">이 구성은 선택한 예시입니다</text><path d="M540 232 V282" class="arrow green"/><rect x="420" y="282" width="274" height="124" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="557" y="324" class="label">외부에서 온 응답</text><text x="557" y="361" class="note">Content-Encoding: br</text><text x="557" y="392" class="note">요청 WAF를 거치지 않음</text><rect x="24" y="454" width="752" height="676" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="400" y="498" class="title">Node.js 프로세스</text><path d="M210 406 V544" class="arrow "/><path d="M540 406 V544" class="arrow green"/><rect x="48" y="544" width="330" height="144" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="213" y="587" class="label">요청 처리 코드</text><text x="213" y="629" class="small">앱·미들웨어</text><text x="213" y="666" class="note">Brotli 해제 여부 확인</text><rect x="422" y="544" width="330" height="144" rx="18" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="587" y="587" class="label">HTTP 클라이언트</text><text x="587" y="629" class="small">fetch · 일부 라이브러리</text><text x="587" y="666" class="note">자동 해제 여부 확인</text><path d="M730 544 V246 H696 V232" class="arrow conditional green"/><text x="702" y="436" class="note">요청 ↑</text><path d="M213 688 V735 H400 V780" class="arrow conditional"/><path d="M587 688 V735 H400" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 7"/><rect x="92" y="794" width="616" height="116" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="839" class="label">JavaScript API / 네이티브 바인딩</text><text x="400" y="879" class="note">node:zlib 등 · 라이브러리의 실제 경로 확인</text><path d="M400 910 V950" class="arrow conditional"/><rect x="72" y="950" width="656" height="144" rx="18" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text x="400" y="992" class="label">Node.js에 포함된 Brotli 디코더</text><text x="400" y="1034" class="small">C/C++ 코드 · 같은 프로세스의 메모리</text><text x="400" y="1073" class="note">CVE-2026-111497 수정 대상</text><text x="400" y="1174" class="note">실선: 들어오는 데이터 · 점선: 요청 또는 조건부 해제</text><text x="400" y="1213" class="note">대표 개념도 · 실제 배치·공격 성공을 관측한 그림 아님</text></svg>
