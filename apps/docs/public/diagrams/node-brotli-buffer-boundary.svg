<svg xmlns="http://www.w3.org/2000/svg" width="800" height="806" viewBox="0 0 800 806" role="img" aria-labelledby="title desc"><title id="title">Brotli 디코더의 8바이트 고정 임시 입력 버퍼와 배열 경계</title><desc id="desc">정상 예시의 채움은 설명용입니다. 배열의 유효한 인덱스는 0부터 7까지입니다. 취약한 입력 보충 경로에서 길이가 8인데 인덱스 8에 쓰면 고정 배열 범위 밖입니다. 특정 인접 필드나 실제 메모리 손상을 관측한 도식이 아닙니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;text-anchor:middle;fill:#172033}.title{font-size:34px;font-weight:700}.label{font-size:30px;font-weight:700}.small{font-size:28px}.note{font-size:25px;fill:#475569}.code{font-family:Arial,sans-serif;font-size:25px;font-weight:700}</style><rect width="800" height="806" rx="24" fill="#f8fafc"/><text x="400" y="54" class="title">디코더의 임시 입력 버퍼 · 8바이트</text><text x="400" y="98" class="note">늘어나는 공간이 아니라 고정된 여덟 칸입니다</text><rect x="24" y="130" width="752" height="222" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="400" y="173" class="label">정상 예시 · 읽다 남은 입력 일부를 보관</text><rect x="42" y="205" width="68" height="66" rx="16" fill="#93c5fd" stroke="#93c5fd" stroke-width="2"/><text x="76" y="249" class="small">●</text><text x="76" y="305" class="small">0</text><rect x="118" y="205" width="68" height="66" rx="16" fill="#93c5fd" stroke="#93c5fd" stroke-width="2"/><text x="152" y="249" class="small">●</text><text x="152" y="305" class="small">1</text><rect x="194" y="205" width="68" height="66" rx="16" fill="#93c5fd" stroke="#93c5fd" stroke-width="2"/><text x="228" y="249" class="small">●</text><text x="228" y="305" class="small">2</text><rect x="270" y="205" width="68" height="66" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="304" y="249" class="small">·</text><text x="304" y="305" class="small">3</text><rect x="346" y="205" width="68" height="66" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="380" y="249" class="small">·</text><text x="380" y="305" class="small">4</text><rect x="422" y="205" width="68" height="66" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="456" y="249" class="small">·</text><text x="456" y="305" class="small">5</text><rect x="498" y="205" width="68" height="66" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="532" y="249" class="small">·</text><text x="532" y="305" class="small">6</text><rect x="574" y="205" width="68" height="66" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="608" y="249" class="small">·</text><text x="608" y="305" class="small">7</text><text x="400" y="337" class="note">유효한 칸 번호 0~7 · 채움과 길이는 설명용</text><rect x="24" y="386" width="752" height="240" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="400" y="429" class="label">취약 경로 · 상태 진전 없이 보충이 이어지면</text><rect x="42" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="76" y="506" class="small">●</text><text x="76" y="560" class="small">0</text><rect x="118" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="152" y="506" class="small">●</text><text x="152" y="560" class="small">1</text><rect x="194" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="228" y="506" class="small">●</text><text x="228" y="560" class="small">2</text><rect x="270" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="304" y="506" class="small">●</text><text x="304" y="560" class="small">3</text><rect x="346" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="380" y="506" class="small">●</text><text x="380" y="560" class="small">4</text><rect x="422" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="456" y="506" class="small">●</text><text x="456" y="560" class="small">5</text><rect x="498" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="532" y="506" class="small">●</text><text x="532" y="560" class="small">6</text><rect x="574" y="462" width="68" height="66" rx="16" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/><text x="608" y="506" class="small">●</text><text x="608" y="560" class="small">7</text><rect x="688" y="462" width="68" height="66" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 7"/><text x="722" y="506" class="label">!</text><text x="722" y="560" class="small">8</text><path d="M666 451 V574" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 5"/><text x="400" y="606" class="small">길이 8에서 u8[8]에 쓰면 배열 범위 밖</text><text x="400" y="679" class="small">배열 크기가 늘어난 것이 아니라, 경계를 넘어선 쓰기</text><text x="400" y="725" class="note">8바이트 입력 자체가 취약점을 뜻하는 것은 아닙니다</text><text x="400" y="765" class="note">실제 메모리 배치·손상 값·공격 바이트를 표시한 그림 아님</text></svg>
