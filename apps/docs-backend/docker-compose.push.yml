# Opt-in overlay: docker compose -f docker-compose.yml -f docker-compose.push.yml up -d
services:
  docs-backend:
    environment:
      PUSH_ENABLED: 'true'
      PUSH_API_TOKEN_FILE: /run/secrets/push_api_token
      PUSH_ADMIN_TOKEN_FILE: /run/secrets/push_admin_token
      PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/push_vapid_private_key
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:?Set PUSH_VAPID_PUBLIC_KEY}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:?Set PUSH_VAPID_SUBJECT}
      PUSH_STORE_FILE: /app/data/push-subscriptions.json
    volumes:
      - '${DOCS_PUSH_DATA_PATH:-./data}:/app/data:rw'
    secrets:
      - push_api_token
      - push_admin_token
      - push_vapid_private_key

secrets:
  push_api_token:
    file: ${DOCS_PUSH_API_TOKEN_FILE:-./secrets/push_api_token}
  push_admin_token:
    file: ${DOCS_PUSH_ADMIN_TOKEN_FILE:-./secrets/push_admin_token}
  push_vapid_private_key:
    file: ${DOCS_PUSH_VAPID_PRIVATE_KEY_FILE:-./secrets/push_vapid_private_key}
