<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Browser rendering pipeline</title>
  <desc id="description">Four offset layers representing document, style, layout, and paint work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717" />
      <stop offset="1" stop-color="#3b2a20" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1a" />
      <stop offset="1" stop-color="#f7b267" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="36" fill="url(#background)" />
  <g fill="none" stroke-width="3">
    <rect x="120" y="112" width="680" height="312" rx="24" stroke="#706b63" />
    <rect x="190" y="150" width="680" height="312" rx="24" stroke="#a39b90" />
    <rect x="260" y="188" width="680" height="312" rx="24" stroke="#d8d2c8" />
    <rect x="330" y="226" width="680" height="312" rx="24" stroke="url(#accent)" />
  </g>
  <g font-family="ui-monospace, monospace" font-size="28" font-weight="700" letter-spacing="4">
    <text x="92" y="92" fill="#a39b90">DOM</text>
    <text x="950" y="172" fill="#d8d2c8">STYLE</text>
    <text x="92" y="498" fill="#d8d2c8">LAYOUT</text>
    <text x="900" y="554" fill="#ff7a2e">PAINT</text>
  </g>
</svg>
