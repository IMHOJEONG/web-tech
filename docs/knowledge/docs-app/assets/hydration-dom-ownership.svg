<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
  <title id="title">같은 DOM을 바꾸던 테스트를 별도 측정 문서로 분리한 이유</title>
  <desc id="desc">수정 전 테스트는 React가 관리하는 완성 화면 A를 골격 B로 직접 교체했다. 늦게 연결하는 React가 예상과 다른 골격 B를 발견해 트리를 재생성하면 테스트의 골격은 사라진다. 보완 후 원본 A는 React가 계속 관리하고, 테스트는 실제 서버 골격과 로드된 스타일 및 폰트를 복제한 별도 정적 문서 B를 측정한다.</desc>
  <defs>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #17212b; }
      .heading { font-size: 25px; font-weight: 750; }
      .label { font-size: 21px; font-weight: 650; }
      .body { font-size: 18px; }
      .muted { font-size: 16px; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="670" rx="24" fill="#f8fafc"/>
  <text x="40" y="48" class="heading">이전: React가 관리하는 DOM에 테스트가 끼어듭니다</text>
  <rect x="40" y="82" width="280" height="156" rx="14" fill="#eff6ff" stroke="#2563eb"/>
  <text x="60" y="116" class="label">① 화면 A가 보임</text>
  <text x="60" y="151" class="body">실제 글 · 필터 · 카드</text>
  <text x="60" y="183" class="body">React의 예상 트리도 A</text>
  <text x="60" y="215" class="muted">일부 연결 작업은 아직 진행 중</text>
  <path d="M325 160H369" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="82" width="280" height="156" rx="14" fill="#fff7ed" stroke="#c2410c"/>
  <text x="400" y="116" class="label">② 테스트가 B로 교체</text>
  <text x="400" y="151" class="body">replaceWith(골격 B)</text>
  <text x="400" y="183" class="body">실제 DOM만 B로 바뀜</text>
  <text x="400" y="215" class="muted">React의 예상 트리는 여전히 A</text>
  <path d="M665 160H709" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="82" width="280" height="156" rx="14" fill="#fff1f2" stroke="#be123c"/>
  <text x="740" y="116" class="label">③ 늦은 연결과 충돌</text>
  <text x="740" y="151" class="body">예상 A ≠ 실제 B</text>
  <text x="740" y="183" class="body">오류 후 트리 재생성</text>
  <text x="740" y="215" class="muted">측정 중인 골격 B가 사라짐</text>
  <text x="40" y="274" class="muted">동시에 두 스레드가 쓰는 뜻이 아닙니다. 비동기 작업의 실행 순서가 엇갈리는 경합입니다.</text>
  <path d="M40 303H1000" stroke="#cbd5e1"/>
  <text x="40" y="348" class="heading">보완: 실제 실행과 정적 기하 측정을 분리합니다</text>
  <rect x="40" y="380" width="440" height="165" rx="14" fill="#eff6ff" stroke="#2563eb"/>
  <text x="62" y="418" class="label">원본 페이지 A</text>
  <text x="62" y="455" class="body">React가 그대로 관리</text>
  <text x="62" y="488" class="body">실제 화면 완료 · 테마 · 오류 검사 유지</text>
  <text x="62" y="520" class="muted">테스트가 원본 main을 교체하지 않음</text>
  <rect x="560" y="380" width="440" height="165" rx="14" fill="#ecfdf5" stroke="#047857"/>
  <text x="582" y="418" class="label">별도 측정 문서 B</text>
  <text x="582" y="455" class="body">서버 골격 + 실제 셸 · CSS · 폰트 복제</text>
  <text x="582" y="488" class="body">앱 스크립트 실행 차단</text>
  <text x="582" y="520" class="muted">좌표 · 상태 안내 · 모션 기준은 그대로</text>
  <path d="M485 456H548" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="40" y="592" class="body">로컬에서 재현한 충돌을 설명한 도식입니다. 모든 mismatch가 이 원인이라는 뜻은 아닙니다.</text>
  <text x="40" y="626" class="muted">정적 골격 측정 통과는 실제 사용자 전환·전체 hydration·CLS 검증의 대체물이 아닙니다.</text>
</svg>
