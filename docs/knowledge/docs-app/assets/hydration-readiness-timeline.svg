<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">화면 표시와 hydration 완료는 서로 다른 시점이다</title>
  <desc id="desc">서버 HTML은 먼저 표시될 수 있고, 브라우저는 별도로 클라이언트 코드를 준비해 영역별 hydration을 진행한다. 요소가 보이거나 폰트가 준비되어도 해당 영역의 React 연결 완료를 의미하지 않는다. 이 그림은 상대적인 순서의 예시이지 측정한 시간표가 아니다.</desc>
  <defs>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #17212b; }
      .heading { font-size: 28px; font-weight: 750; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 18px; }
      .muted { fill: #475569; font-size: 16px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="620" rx="24" fill="#f8fafc"/>
  <text x="40" y="52" class="heading">보이는 화면과 React 연결은 따로 진행됩니다</text>
  <text x="40" y="82" class="muted">상대적인 순서 예시 · 실제 실행 시간을 측정한 그래프가 아닙니다</text>
  <path d="M220 122H985" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="112" class="muted">먼저</text><text x="942" y="112" class="muted">나중</text>
  <text x="40" y="190" class="label">서버 HTML</text>
  <rect x="220" y="151" width="210" height="58" rx="12" fill="#dcfce7" stroke="#15803d"/>
  <text x="245" y="187" class="label">HTML 표시 가능</text>
  <path d="M430 180H980" stroke="#15803d" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="40" y="280" class="label">클라이언트 코드</text>
  <rect x="220" y="241" width="360" height="58" rx="12" fill="#fef3c7" stroke="#a16207"/>
  <text x="242" y="277" class="label">코드 수신 · 파싱 · 실행 준비</text>
  <text x="40" y="370" class="label">React 연결</text>
  <rect x="580" y="331" width="400" height="58" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="602" y="367" class="label">해당 영역의 hydration 진행 → 완료</text>
  <path d="M650 237V327M650 393V417" stroke="#b45309" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="543" y="205" width="214" height="32" rx="8" fill="#fff7ed"/>
  <text x="558" y="227" class="body" fill="#92400e">예: 폰트는 준비됨</text>
  <rect x="40" y="435" width="960" height="84" rx="14" fill="#fff1f2" stroke="#be123c"/>
  <text x="60" y="468" class="label" fill="#9f1239">테스트가 먼저 “준비 완료”라고 판단하면?</text>
  <text x="60" y="498" class="body">요소가 보임 + fonts.ready만 확인하고 DOM을 교체해도 React 작업은 남아 있을 수 있습니다.</text>
  <text x="40" y="559" class="body">‘늦은 hydration’ = 여기서는 테스트의 관측보다 연결 작업이 나중까지 진행된다는 뜻입니다.</text>
  <text x="40" y="588" class="muted">영역별 완료 순서는 달라질 수 있습니다. 지연 시간·장애 여부는 이 그림만으로 판단할 수 없습니다.</text>
</svg>
