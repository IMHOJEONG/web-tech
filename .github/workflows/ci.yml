name: CI

on:
  push:
    branches: ["main", "feature/docs"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit Messages
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      - name: Lint push commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >
          pnpm exec commitlint
          --from "${{ github.event.before }}"
          --to "${{ github.sha }}"
          --verbose

  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Validate catalog references
        run: pnpm validate:catalog

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

  shared-ui:
    name: Shared UI (${{ matrix.suite }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["test:ui", "test:ui:consumer"]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Run shared UI regression tests
        run: pnpm --filter docs ${{ matrix.suite }}

  offline-reading:
    name: Docs Offline Reading
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Test explicit offline saving and disconnected reading
        run: pnpm --filter docs test:offline

  unit-contract-tests:
    name: Unit and Contract Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

      - name: Repo validation tests
        run: pnpm test:repo

      - name: Docs content validation tests
        run: pnpm --filter docs test:content

      - name: Docs lib tests
        run: pnpm --filter docs test:lib

      - name: Vuln radar feed and overview metric tests
        run: pnpm --filter vuln-radar test:lib

      - name: Critical rendering path lab tests
        run: pnpm test:crp-lab

      - name: Docs backend contract tests
        run: pnpm --filter docs-backend test:e2e --runInBand

  docs-browser:
    name: Docs Browser (${{ matrix.suite }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: responsive-mobile
            command: pnpm --filter docs test:e2e --project=chromium-mobile
          - suite: responsive-tablet
            command: pnpm --filter docs test:e2e --project=chromium-tablet
          - suite: responsive-desktop
            command: pnpm --filter docs test:e2e --project=chromium-desktop
          - suite: article-production
            command: pnpm --filter docs test:article:prod
          - suite: crp-lab
            command: pnpm test:crp-lab:browser
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Run browser suite
        run: ${{ matrix.command }}

  test:
    name: Test
    if: ${{ always() }}
    needs: [unit-contract-tests, docs-browser, offline-reading]
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Require every test suite to succeed
        env:
          UNIT_RESULT: ${{ needs.unit-contract-tests.result }}
          BROWSER_RESULT: ${{ needs.docs-browser.result }}
          OFFLINE_RESULT: ${{ needs.offline-reading.result }}
        run: |
          printf 'unit-contract-tests=%s docs-browser=%s offline-reading=%s\n' "$UNIT_RESULT" "$BROWSER_RESULT" "$OFFLINE_RESULT"
          test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success && test "$OFFLINE_RESULT" = success
