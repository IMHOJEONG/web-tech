name: Approved private content verification

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main commit SHA (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify exact approved code and remote approval policy before accessing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/private-content-ci-policy.mts

  content:
    needs: authorize
    if: needs.authorize.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    environment: docs-private-content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-node-runtime.mts
      - name: Install dependencies without content credentials or shared caches
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify the reviewed private release without deployment
        env:
          DOCS_CONTENT_SOURCE: private-git
          DOCS_PRIVATE_CONTENT_SSH_KEY: ${{ secrets.DOCS_PRIVATE_CONTENT_SSH_KEY }}
          BLOG_CONTENT_INCLUDE_REMOTE_INDEX: "false"
        run: node scripts/verify-private-content-ci.mts
