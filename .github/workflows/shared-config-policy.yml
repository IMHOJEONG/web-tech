name: Shared Configuration Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Shared Configuration Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Check CODEOWNERS and policy regression
        run: node --experimental-strip-types --test scripts/shared-config-policy.test.mts
      - name: Check generated ownership file
        run: node --experimental-strip-types scripts/shared-config-policy.mts --check
