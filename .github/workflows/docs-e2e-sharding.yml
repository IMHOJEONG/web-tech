name: Docs E2E Sharding Experiment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/docs-e2e-sharding.yml
      - apps/docs/e2e/**
      - apps/docs/scripts/*e2e*.ts
      - scripts/docs-e2e*.test.mts

permissions:
  contents: read

jobs:
  sample:
    if: github.head_ref == 'codex/docs-desktop-e2e-timing-20261115' && github.event.pull_request.head.repo.full_name == github.repository
    name: E2E shard probe (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id:
          [
            r1-baseline,
            r1-shard-1,
            r1-shard-2,
            r2-shard-2,
            r2-baseline,
            r2-shard-1,
            r3-shard-1,
            r3-shard-2,
            r3-baseline,
          ]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify Node security floor
        run: node scripts/check-node-runtime.mts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify preinstalled Chromium
        timeout-minutes: 2
        run: node scripts/check-browser-runtime.mts
      - name: Measure unchanged desktop suite
        id: measure
        env:
          SAMPLE_ID: ${{ matrix.id }}
          DOCS_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'summary=%s/e2e-public/sample.json\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          node apps/docs/scripts/ci-e2e-sample.ts "$SAMPLE_ID" "$RUNNER_TEMP/e2e-private" "$RUNNER_TEMP/e2e-public" "$RUNNER_NAME"
      - name: Upload allowlisted synthetic counters only
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ steps.measure.outputs.summary }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

  compare:
    name: E2E sharding coverage and comparison
    if: ${{ always() && !cancelled() && needs.sample.result != 'skipped' }}
    needs: sample
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download synthetic counters
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-counters
      - name: Verify all samples and original outcomes
        env:
          SAMPLE_RESULT: ${{ needs.sample.result }}
          DOCS_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node apps/docs/scripts/ci-e2e-aggregate.ts "$RUNNER_TEMP/e2e-counters" "$GITHUB_STEP_SUMMARY" "$GITHUB_RUN_ATTEMPT"
          test "$SAMPLE_RESULT" = success
